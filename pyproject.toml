[project]
name = "market-signal-lab"
version = "0.1.0"
description = "A small, serious quant-research lakehouse: free market data -> Dockerized ingestion -> Parquet -> Databricks medallion (SQL) -> hypothesis tests -> backtests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Roman Shaposhnikov" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "yfinance>=0.2.50",
    "requests>=2.32",
    "lxml>=5",
    "databricks-sdk>=0.40",
]

[project.scripts]
msl = "msl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.8"]
research = ["jupyterlab>=4", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msl"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
